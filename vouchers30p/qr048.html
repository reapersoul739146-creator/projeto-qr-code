<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu Voucher | Barbearia Odara</title>
    <link rel="icon" type="image/png" href="../images/barbaeariaOdara.jpeg">

    <link rel="stylesheet" href="../styles/style.css">


</head>

<body>

    <img src="../images/nebulosa.jpeg" alt="" class="fundo-nebulosa"> <div class="estrelas-container" aria-hidden="true"></div> 
    
    <!-- O restante do seu HTML continua aqui -->

    <!-- Área reservada para as estrelas animadas -->
    <div class="estrelas-container" aria-hidden="true"></div>

    <!-- Conteúdo principal do voucher -->
    <main class="voucher">
    <div class="identifier">0048</div>

        <!-- Logo da barbearia -->
        <div class="logo-container">
            <img src="../images/barbaeariaOdara.jpeg" alt="Logo da Barbearia Odara" class="logo">
        </div>

        <!-- Mensagem de premiação -->
        <section class="premio">

            <h1>PARABÉNS!</h1>

            <h2>VOCÊ GANHOU...</h2>

            <div class="desconto">
                <span class="porcentagem">30%</span>
                <span class="texto-desconto">DE DESCONTO</span>
            </div>

        </section>

        <!-- Condições de utilização do voucher -->
        <footer class="voucher-footer">

            <p class="condicoes">
                Este voucher é válido apenas se, na próxima vez que vier
                à Barbearia Odara Cortes, você trouxer um cliente pagante para indicar.
            </p>

        </footer>

    </main>

    <!-- Futuro JavaScript das animações e da validação do QR Code -->
    <script src="../scripts/script.js"></script>

</body>

</html>
